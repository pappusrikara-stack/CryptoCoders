name: Flagsmith preflight
on:
  pull_request:   # every PR: a path filter would skip a fix that makes the PR match main
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Other repos use: pappusrikara-stack/CryptoCoders/lab@main
      - uses: ./lab
        with:
          start: python3 -m http.server 8787 --directory site
          url: http://localhost:8787/

  # A stock React app (Flagsmith React SDK), built from scratch, preflighted with no app changes.
  preflight-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./lab
        with:
          config: examples/react-pricing/preflight.config.mjs
          start: cd examples/react-pricing && npm ci && npm run build && npm run preview
          url: http://localhost:8788/
          comment: 'false'
