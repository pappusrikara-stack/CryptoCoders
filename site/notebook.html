<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Notebook: Toggle Wars helper</title>
<link rel="stylesheet" href="style.css">
<style>
  .exp h2 { justify-content: space-between; } .exp p { margin: 6px 0; }
  .log { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .k { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow"><a href="./">← Submission helper</a></p>
    <h1>Lab Notebook</h1>
    <p class="lede">Every experiment this page runs on itself: the hypothesis, the result and what shipped. An agent proposes each change; a human approves it by merging a pull request.</p>
  </header>
  <div id="list" style="display:flex;flex-direction:column;gap:16px"></div>
</main>
<script type="module">
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const { experiments } = await (await fetch('notebook.json', { cache: 'no-store' })).json();
document.getElementById('list').innerHTML = experiments.slice().reverse().map(e => `
  <section class="card exp">
    <h2>${esc(e.id)} · <code>${esc(e.flag)}</code> <span class="pill ${e.status.startsWith('shipped') ? 'done' : ''}">${esc(e.status)}</span></h2>
    <p>${esc(e.hypothesis)}</p>
    <p class="k">Metric: <code>${esc(e.metric)}</code>${e.result ? ` · Result: ${esc(e.result)}` : ''}</p>
    <ul class="log">${e.log.map(l => `<li><strong>${esc(l.at)}</strong> ${esc(l.what)}</li>`).join('')}</ul>
  </section>`).join('');
</script>
</body>
</html>
